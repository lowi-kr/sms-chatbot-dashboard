name = "sms-chatbot-dashboard"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

[assets]
# Default Cloudflare Pages "Workers with Assets" behavior serves index.html
# for any request that doesn't match a static file — this is meant for SPAs
# (React Router, etc.) but was silently swallowing /config.js before our
# functions/config.js Pages Function ever got a chance to run.
# "404-page" disables that fallback: unmatched paths now correctly fall
# through to Functions (or a real 404 if no Function matches either).
not_found_handling = "404-page"
